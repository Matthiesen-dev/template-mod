[versions]
kotlin = "2.2.20"

# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
minecraft = "1.21.1"
parchment = "2024.11.17"

# Loader versions
## NeoForm is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo-form = "1.21.1-20240808.144430"
fabric-loom = "1.15-SNAPSHOT"
fabric-api = "0.109.0+1.21.1"
fabric-version = "0.109.0+1.21.1"
fabric-loader = "0.16.9"
neoforge-moddev = "2.0.146"
neoforge-loader = "21.1.249"

# mixin
sponge-mixin = "0.8.5"
mixin-extras = "0.5.4"

[plugins]
fabric-loom = { id = "fabric-loom", version.ref = "fabric-loom" }
neoforged-moddev = { id = "net.neoforged.moddev", version.ref = "neoforge-moddev" }

[libraries]
kotlin-gradle = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
fabric-api = { group = "net.fabricmc.fabric-api", name = "fabric-api", version.ref = "fabric-api" }
fabric-loader = { group = "net.fabricmc", name = "fabric-loader", version.ref = "fabric-loader" }
minecraft-fabric = { group = "com.mojang", name = "minecraft", version.ref = "minecraft" }

# mixin
sponge-mixin = { group = "org.spongepowered", name = "mixin", version.ref = "sponge-mixin" }
mixin-extras = { group = "io.github.llamalad7", name = "mixinextras-common", version.ref = "mixin-extras" }

[bundles]
common-mixin = ["sponge-mixin", "mixin-extras"]
fabric-mods = ["fabric-loader", "fabric-api"]